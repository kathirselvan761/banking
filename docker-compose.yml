version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: banking-ai-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - banking-ai-network

  # Node.js + Express Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: banking-ai-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/banking_ai
      - AI_SERVICE_URL=http://ai-service:8000
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - banking-ai-network

  # Python + FastAPI AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: banking-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENV=development
      - BACKEND_URL=http://backend:5000/api
    networks:
      - banking-ai-network

  # React.js + Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: banking-ai-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:5000/api
      - VITE_AI_SERVICE_URL=http://localhost:8000
    depends_on:
      - backend
      - ai-service
    networks:
      - banking-ai-network

networks:
  banking-ai-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
